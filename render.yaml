# DBの秘密情報はRenderで入力。GitHubには保存しません。
services:
  - type: web
    name: cat-mouse-game
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
