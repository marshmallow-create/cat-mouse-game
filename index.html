<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラテのネズミさがし</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-card">
    <header class="game-header">
      <div>
        <p class="eyebrow">どんどん捕まえよう！</p>
        <h1>ラテのネズミさがし <img class="title-cat" src="images/latte.png" alt=""></h1>
        <p class="intro">30秒でネズミを何匹つかまえられるかな？ 5秒ごとにネズミが1匹増えるよ！</p>
      </div>
      <div class="status" aria-label="ゲームの記録">
        <div class="status-item"><span>スコア</span><strong id="score">0</strong></div>
        <div class="status-item"><span>残り時間</span><strong><span id="time">30</span><small>秒</small></strong></div>
      </div>
    </header>

    <section class="field-wrap" aria-label="ゲーム画面">
      <div id="field" class="field">
        <img id="cat" class="character cat" src="images/latte.png" alt="猫" draggable="false">
        <img id="mouse" class="character mouse" src="images/ネズミ.png" alt="ネズミ" draggable="false">

        <div id="start-screen" class="overlay">
          <div class="result-card">
            <div class="result-emoji" aria-hidden="true"><img class="result-cat" src="images/latte.png" alt=""><img class="result-mouse" src="images/ネズミ.png" alt=""></div>
            <h2>準備はいい？</h2>
            <p>STARTを押したら3秒後にゲームが始まるよ</p>
            <button id="start" type="button">START</button>
          </div>
        </div>

        <div id="countdown-screen" class="overlay countdown-screen" hidden aria-label="開始までのカウントダウン">
          <span id="countdown-number" class="countdown-number" aria-live="polite">3</span>
        </div>

        <div id="game-over" class="overlay" hidden>
          <div class="result-card">
            <div class="result-emoji" aria-hidden="true"><img class="result-cat" src="images/latte.png" alt="">✨</div>
            <h2>おつかれさま！</h2>
            <p>ネズミを <strong id="final-score">0</strong> 匹つかまえたよ</p>
            <button id="restart" type="button">START <small>もう一度遊ぶ</small></button>
          </div>
        </div>
      </div>
    </section>

    <p class="instructions"><span aria-hidden="true">⌨️</span> 矢印キー または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> で猫を動かそう</p>
  </main>
</body>
</html>
