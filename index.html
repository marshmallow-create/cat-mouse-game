<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ねこさんのネズミさがし</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-card">
    <header class="game-header">
      <div>
        <p class="eyebrow">ちいさな おにごっこ</p>
        <h1>ねこさんのネズミさがし <span aria-hidden="true">🐱</span></h1>
        <p class="intro">30秒でネズミを何匹つかまえられるかな？</p>
      </div>
      <div class="status" aria-label="ゲームの記録">
        <div class="status-item"><span>スコア</span><strong id="score">0</strong></div>
        <div class="status-item"><span>残り時間</span><strong><span id="time">30</span><small>秒</small></strong></div>
      </div>
    </header>

    <section class="field-wrap" aria-label="ゲーム画面">
      <div id="field" class="field">
        <span class="flower flower-one" aria-hidden="true">✿</span>
        <span class="flower flower-two" aria-hidden="true">✿</span>
        <span class="flower flower-three" aria-hidden="true">✿</span>
        <span class="flower flower-four" aria-hidden="true">✿</span>
        <div id="cat" class="character cat" role="img" aria-label="猫">🐱</div>
        <div id="mouse" class="character mouse" role="img" aria-label="ネズミ">🐭</div>

        <div id="game-over" class="game-over" hidden>
          <div class="result-card">
            <div class="result-emoji" aria-hidden="true">🐱✨</div>
            <h2>おつかれさま！</h2>
            <p>ネズミを <strong id="final-score">0</strong> 匹つかまえたよ</p>
            <button id="restart" type="button">もう一度遊ぶ</button>
          </div>
        </div>
      </div>
    </section>

    <p class="instructions"><span aria-hidden="true">⌨️</span> 矢印キー または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> で猫を動かそう</p>
  </main>
</body>
</html>
